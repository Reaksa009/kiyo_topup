version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: kiyo_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kiyo_topup
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: kiyo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kiyo_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/kiyo_topup
      REDIS_URI: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      ABA_PAYWAY_API_KEY: ${ABA_PAYWAY_API_KEY:?ABA_PAYWAY_API_KEY must be set}
      BAKONG_API_TOKEN: ${BAKONG_API_TOKEN:?BAKONG_API_TOKEN must be set}
      G2BULK_API_KEY: ${G2BULK_API_KEY:?G2BULK_API_KEY must be set}
      G2BULK_API_SECRET: ${G2BULK_API_SECRET:?G2BULK_API_SECRET must be set}
      BAKONG_WEBHOOK_SECRET: ${BAKONG_WEBHOOK_SECRET:?BAKONG_WEBHOOK_SECRET must be set}
      G2BULK_WEBHOOK_SECRET: ${G2BULK_WEBHOOK_SECRET:?G2BULK_WEBHOOK_SECRET must be set}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL must be set}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kiyo_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: kiyo_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
  redis_data:
